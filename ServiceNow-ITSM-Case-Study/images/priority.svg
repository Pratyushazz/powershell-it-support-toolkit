<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320"><rect width="800" height="320" fill="white"/><text x="400" y="35" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#20384c">Example Priority Levels</text><rect x="120" y="65" width="560" height="45" rx="8" fill="#f4dede" stroke="#5a7080"/><text x="400" y="94" text-anchor="middle" font-family="Arial" font-size="18" fill="#233b4d">P1 — Major outage</text><rect x="120" y="123" width="560" height="45" rx="8" fill="#f7e7d2" stroke="#5a7080"/><text x="400" y="152" text-anchor="middle" font-family="Arial" font-size="18" fill="#233b4d">P2 — Significant impact</text><rect x="120" y="181" width="560" height="45" rx="8" fill="#e8eff5" stroke="#5a7080"/><text x="400" y="210" text-anchor="middle" font-family="Arial" font-size="18" fill="#233b4d">P3 — Moderate / individual</text><rect x="120" y="239" width="560" height="45" rx="8" fill="#e6f1e7" stroke="#5a7080"/><text x="400" y="268" text-anchor="middle" font-family="Arial" font-size="18" fill="#233b4d">P4 — Low impact</text></svg>